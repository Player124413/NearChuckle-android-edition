name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 'Build Far Cry Android APK & Engine (ARM64)'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK (r25c)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build zip unzip

      - name: Build Native Engine & Dependencies (ARM64)
            shell: bash
        run: |
          chmod +x buildscripts/build_android.sh
          echo "Starting native build..."
          ./buildscripts/build_android.sh --arch arm64 --release --ndk "${{ steps.setup-ndk.outputs.ndk-path }}" 2>&1 | tee build_native.log
          echo "### ✅ Native Build Succeeded" >> $GITHUB_STEP_SUMMARY

      - name: Print Native error log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f build_native.log ]; then
            echo "====================== NATIVE BUILD ERROR LOG ======================"
            grep -E -C 3 "error:|FAILED:|CMake Error" build_native.log | tail -n 120 || tail -n 120 build_native.log
          fi

      - name: Build APK with Gradle
        shell: bash
        run: |
          chmod +x android/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> android/local.properties
          if [ -f android/app/farcry.keystore ]; then
            echo "Verifying project signing keystore..."
            keytool -list -keystore android/app/farcry.keystore -storepass android || {
              echo "Re-generating standardized keystore..."
              rm -f android/app/farcry.keystore
              keytool -genkeypair -v -keystore android/app/farcry.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=NearChuckle, OU=FarCry, O=NearChuckle, C=US"
            }
          fi
          echo "Building APK with Gradle..."
          ./android/gradlew -p android :app:assembleDebug --stacktrace 2>&1 | tee build_apk.log
          echo "### ✅ Gradle Build Succeeded" >> $GITHUB_STEP_SUMMARY

      - name: Print Gradle error log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f build_apk.log ]; then
            echo "====================== GRADLE ERROR LOG TAIL ======================"
            tail -n 100 build_apk.log
          fi

      - name: Inspect Built APK
        shell: bash
        run: |
          set -e
          echo "================ All APKs in Workspace ================"
          find . -name "*.apk" -ls
          
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in workspace!"
            exit 1
          fi

          echo "Selected APK: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "### 📦 Generated APK: \`$(basename $APK_PATH)\` ($(ls -lh $APK_PATH | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY

          echo "=== Packaged native libraries (.so) ==="
          unzip -l "$APK_PATH" | grep "lib/arm64-v8a"

          echo "=== Verifying critical native libraries in APK ==="
          if ! unzip -l "$APK_PATH" | grep -q "libc++_shared.so"; then
            echo "::error::libc++_shared.so is missing from APK!"
            exit 1
          fi
          if ! unzip -l "$APK_PATH" | grep -q "libFarCry.so"; then
            echo "::error::libFarCry.so is missing from APK!"
            exit 1
          fi
          if ! unzip -l "$APK_PATH" | grep -q "libSDL3.so"; then
            echo "::error::libSDL3.so is missing from APK!"
            exit 1
          fi
          if ! unzip -l "$APK_PATH" | grep -q "libGL.so"; then
            echo "::error::libGL.so (gl4es) is missing from APK!"
            exit 1
          fi
          echo "All critical native libraries successfully verified in APK!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearChuckle-FarCry-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Native .SO Libraries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearChuckle-FarCry-Native-SO-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a/*.so
          retention-days: 30

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_native.log
            build_apk.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Push Build Log to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-log-arm64 2>/dev/null || git checkout -B build-log-arm64
          git rm -rf . >/dev/null 2>&1 || true
          [ -f build_native.log ] && tail -n 500 build_native.log > build_native_tail.txt
          [ -f build_apk.log ] && tail -n 500 build_apk.log > build_apk_tail.txt
          git add build_native_tail.txt build_apk_tail.txt 2>/dev/null || true
          git commit -m "Build logs" || true
          git push -f origin build-log-arm64 || true
